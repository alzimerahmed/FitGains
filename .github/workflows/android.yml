name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships an Android SDK ($ANDROID_HOME); just ensure the
      # packages our AGP/compileSdk need are present
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --console=plain

      - name: Prepare signing keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keys/fitgains.jks"
          else
            # No committed signing key: generate a throwaway keystore.
            # Set the ANDROID_KEYSTORE_BASE64 secret for stable signatures
            # (required for seamless upgrades between releases).
            keytool -genkey -v -keystore "$RUNNER_TEMP/keys/fitgains.jks" \
              -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
              -alias fitgains -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'fitgains' }}" \
              -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'fitgains' }}" \
              -dname "CN=FitGains, OU=Apps, O=FitGains, C=00"
          fi

      - name: Sign APK
        run: |
          APK_UNSIGNED=$(find android/app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'fitgains' }}"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/keys/fitgains.jks" \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out fitgains.apk "$APK_UNSIGNED"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify fitgains.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: fitgains-apk
          path: fitgains.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fitgains.apk
